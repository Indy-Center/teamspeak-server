name: CI

# Runs on pull requests, and from build-and-deploy.yml on main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config -q

      # --profile tools also pulls data-tools, the image backup.sh and restore.sh use.
      - name: Images exist
        run: docker compose -f deploy/docker-compose.yml --profile tools pull --quiet

      # Uses the VPS layout, ~/apps/<app>/.
      - name: Server starts and stays up
        run: |
          mkdir -p ~/apps
          cp -r deploy ~/apps/"$APP"
          cd ~/apps/"$APP"
          docker compose up -d
          sleep 15
          docker compose ps
          # Fail if any container is restarting or has restarted.
          if docker inspect -f '{{.State.Restarting}} {{.RestartCount}}' $(docker compose ps -aq) | grep -qv '^false 0$'; then
            docker compose logs --tail 50
            exit 1
          fi

      # The backup recipe's round trip. It starts its own server, so stop this one to free the ports.
      - name: Back up, wipe and restore
        run: |
          (cd ~/apps/"$APP" && docker compose down -v)
          bash tests/backup-round-trip.sh
