# TeamSpeak 3 server, deployed to /home/deploy/apps/teamspeak-server/ on the Vanderbilt VPS.
services:
  teamspeak:
    image: teamspeak:3.13.7@sha256:c1f32b157d1b5cb922bb64656b416f09fb5e854723a45be04635485a4e8e56a2
    restart: unless-stopped
    # Written on the VPS by the deploy from the repo's ENV_* settings.
    env_file:
      - path: .env
        required: false
    environment:
      TS3SERVER_LICENSE: accept
      TS3SERVER_IP_ALLOWLIST: /etc/ts3server/query_ip_allowlist.txt
    ports:
      - "9987:9987/udp" # voice
      - "30033:30033/tcp" # file transfer
      - "127.0.0.1:10011:10011/tcp" # ServerQuery, loopback only
    volumes:
      - ts3-data:/var/ts3server
      - ./query_ip_allowlist.txt:/etc/ts3server/query_ip_allowlist.txt:ro
    networks:
      teamspeak:
        ipv4_address: 172.30.10.10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  teamspeak:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  ts3-data:
