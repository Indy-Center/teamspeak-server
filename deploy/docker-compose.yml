# TeamSpeak 3 server, deployed to /home/deploy/apps/teamspeak-server/ on the Vanderbilt VPS.
services:
  teamspeak:
    image: teamspeak:3.13.8@sha256:2b3412de8b5ccd93cf131f2be5719e6dbc188e8729705dafa0c59b5debb63c4a
    restart: unless-stopped
    # No env_file: .env holds teamspeak-bot's settings, which TeamSpeak must not see.
    environment:
      TS3SERVER_LICENSE: accept
      TS3SERVER_IP_ALLOWLIST: /etc/ts3server/query_ip_allowlist.txt
      # Passed through from .env or the shell only when set (the backup test sets it); naming just
      # this one keeps teamspeak-bot's settings out of TeamSpeak's container.
      TS3SERVER_SERVERADMIN_PASSWORD:
    ports:
      - "9987:9987/udp" # voice
      - "30033:30033/tcp" # file transfer
      - "127.0.0.1:10011:10011/tcp" # ServerQuery, loopback only
    volumes:
      - ts3-data:/var/ts3server
      - ./query_ip_allowlist.txt:/etc/ts3server/query_ip_allowlist.txt:ro
    networks:
      teamspeak:
        ipv4_address: 172.30.10.10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Applies larry's TeamSpeak jobs over ServerQuery (bot/). Only started with the `bot` profile, which
  # only ALEXANDRIA's deploy turns on: it must never run against the droplet's server.
  teamspeak-bot:
    # On main, the deploy pushes this image and pins this line to the build's commit.
    image: ghcr.io/indy-center/teamspeak-bot:latest
    build: ../bot
    profiles: [bot]
    restart: unless-stopped
    init: true # forwards stop signals so the container shuts down promptly
    # Written on the VPS by the deploy from the repo's ENV_* settings; .env.example lists them.
    env_file:
      - path: .env
        required: false
    environment:
      QUERY_HOST: teamspeak
      QUERY_PORT: "10011"
    networks:
      - teamspeak
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Throwaway container for backup.sh and restore.sh; never started by `up`.
  data-tools:
    image: python:3.13.16-alpine3.24@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    profiles: [tools]
    network_mode: none
    volumes:
      - ts3-data:/var/ts3server

networks:
  teamspeak:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  ts3-data:
